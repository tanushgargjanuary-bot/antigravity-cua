[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-cua"
version = "0.1.0"
description = "Antigravity integration for Cua Spaces (isolated cloud sandboxes and computer use)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "cua>=0.5.0",
]

[project.scripts]
antigravity-cua = "antigravity_cua.server:main"
